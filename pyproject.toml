[tool.poetry]
package-mode = true
packages = [{ include = "uq_desktop_processor", from = "src" }]

[project]
name = "uq_desktop_processor"
version = "1.0.0"
description = "AI-assisted visual urban assessment from street-level imagery: road-network sampling, Mapillary downloads, CLIP/ViT scoring, and GIS-ready exports (GeoJSON/GPKG)."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "LicenseRef-UNLICENSED"
license-files = ["LICENSE"]
authors = [{ name = "Antek-N", email = "antek.nikolajdu@gmail.com" }]
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
uq_desktop_processor = "uq_desktop_processor.__main__:main"
uq-desktop-processor = "uq_desktop_processor.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
torch = "^2.4.0"
torchvision = "^0.19.0"
timm = "^1.0.0"
numpy = "<2.0"
pillow = "^10.0.0"
tqdm = "^4.66.0"
tabulate = "^0.9.0"
joblib = "^1.4.0"
clip = { git = "https://github.com/openai/CLIP.git" }
ftfy = "^6.3.1"
regex = "^2025.9.1"
geopandas = "^1.0.0"
shapely = "^2.0.0"
pyproj = "^3.6.0"
fiona = "^1.9.0"
pyogrio = "^0.9.0"
osmnx = "^1.9.0"
yaspin = "^3.0.0"
matplotlib = "^3.8.0"
requests = "^2.32.0"
opencv-python-headless = "^4.9.0"
piexif = "^1.1.3"
py360convert  = "^0.1.0"
pyside6 = "^6.11.0"
gpxpy = "^1.6.2"
pydeck = "^0.9.1"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.12.12"
mypy = "^1.17.1"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pre-commit = "^3.6.0"
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocs-autorefs = "^1.2"
mkdocs-gen-files = "^0.5"
mkdocs-literate-nav = "^0.6"
mkdocstrings = "^0.25"
mkdocstrings-python = "^1.10"
pymdown-extensions = "^10.8"
types-requests = "^2.32.4.20250913"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
fix = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "^(tests/|site/|\\.venv/|out/)"